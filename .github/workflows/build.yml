name: Build and publish test game
on:
  push:
    branches: [main]
    paths: ['game/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: backyard-test-build
  cancel-in-progress: true
jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        character: [scout, poppy]
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Validate complete character runs
        env:
          CHARACTER: ${{ matrix.character }}
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --path game --editor --import --quit
          args=()
          if [ "$CHARACTER" = poppy ]; then args+=(--poppy); fi
          timeout 1800 Godot_v4.7.2-stable_linux.x86_64 --headless --path game --quit-after 300 --script res://tests/chapter_checks.gd -- "${args[@]}" 2>&1 | tee /tmp/chapter.log
          grep -q 'CHAPTER BALANCE PASSED' /tmp/chapter.log
          ! grep -q 'SCRIPT ERROR' /tmp/chapter.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-${{ matrix.character }}
          path: /tmp/chapter.log
  build:
    needs: balance
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare outputs
        run: mkdir -p web android
      - name: Install Godot and export templates
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo "/tmp/godot" >> "$GITHUB_PATH"
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o /tmp/templates.zip
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          unzip -q /tmp/templates.zip 'templates/web*' 'templates/android*' -d /tmp/templates
          cp /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
      - name: Configure Android tools and test signing
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          test -n "$ANDROID_DEBUG_KEYSTORE_B64"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > /tmp/backyard-debug.keystore
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.7.tres
      - name: Import and export
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --path game --editor --import --quit
          timeout 120 Godot_v4.7.2-stable_linux.x86_64 --headless --path game --quit-after 300 -- --smoke-test 2>&1 | tee /tmp/smoke.log
          grep -q 'SMOKE TEST PASSED' /tmp/smoke.log
          ! grep -q 'SCRIPT ERROR' /tmp/smoke.log
          timeout 60 Godot_v4.7.2-stable_linux.x86_64 --headless --path game --quit-after 300 --script res://tests/boss_pressure_checks.gd 2>&1 | tee /tmp/boss-pressure.log
          grep -q 'BOSS PRESSURE PASSED' /tmp/boss-pressure.log
          ! grep -q 'SCRIPT ERROR' /tmp/boss-pressure.log
          timeout 60 Godot_v4.7.2-stable_linux.x86_64 --headless --path game --quit-after 300 --script res://tests/skill_behavior_checks.gd 2>&1 | tee /tmp/skills.log
          grep -q 'SKILL BEHAVIORS PASSED' /tmp/skills.log
          ! grep -q 'SCRIPT ERROR' /tmp/skills.log
          timeout 60 Godot_v4.7.2-stable_linux.x86_64 --headless --path game --quit-after 300 --script res://tests/spawn_xp_checks.gd 2>&1 | tee /tmp/spawn-xp.log
          grep -q 'SPAWN XP PASSED' /tmp/spawn-xp.log
          ! grep -q 'SCRIPT ERROR' /tmp/spawn-xp.log
          timeout 60 Godot_v4.7.2-stable_linux.x86_64 --headless --path game --quit-after 300 --script res://tests/poppy_checks.gd 2>&1 | tee /tmp/poppy.log
          grep -q 'POPPY CHECKS PASSED' /tmp/poppy.log
          ! grep -q 'SCRIPT ERROR' /tmp/poppy.log
          timeout 60 Godot_v4.7.2-stable_linux.x86_64 --headless --path game --quit-after 300 --script res://tests/mastery_checks.gd 2>&1 | tee /tmp/mastery.log
          grep -q 'MASTERY CHECKS PASSED' /tmp/mastery.log
          ! grep -q 'SCRIPT ERROR' /tmp/mastery.log
          timeout 60 Godot_v4.7.2-stable_linux.x86_64 --headless --path game --quit-after 300 --script res://tests/lifetime_checks.gd 2>&1 | tee /tmp/lifetime.log
          grep -q 'LIFETIME ACORN CHECKS PASSED' /tmp/lifetime.log
          ! grep -q 'SCRIPT ERROR' /tmp/lifetime.log
          Godot_v4.7.2-stable_linux.x86_64 --headless --path game --export-release Web ../web/backyard-${GITHUB_SHA}.html
          mv web/backyard-${GITHUB_SHA}.html web/index.html
          cp game/assets/intro/garden-intro.mp4 game/assets/intro/garden-poster.png web/
          cp game/assets/ui/wood-tab-natural.png web/
          python3 game/tools/prepare_web.py web/index.html
          Godot_v4.7.2-stable_linux.x86_64 --headless --path game --export-debug Android ../android/Backyard-Brave.apk
          test -s web/backyard-${GITHUB_SHA}.wasm
          test -s android/Backyard-Brave.apk
          touch web/.nojekyll
          cp android/Backyard-Brave.apk web/
      - uses: actions/upload-artifact@v4
        with:
          name: Backyard-Brave-Android
          path: android/Backyard-Brave.apk
      - name: Publish downloadable test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mobile-test >/dev/null 2>&1 || gh release create mobile-test --title "Mobile test build" --notes "Development test build. Android APK is debug-signed. Browser test: https://kamp-dev.github.io/backyard-brave/"
          gh release upload mobile-test android/Backyard-Brave.apk --clobber
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
