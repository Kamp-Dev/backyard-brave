<style>
body {background:#50653b;}
#status {position:fixed;inset:0;overflow:hidden;background:#50653b url('garden-poster.png') center/cover no-repeat;font-family:Georgia,serif;color:#fff1ca;}
#status-splash {display:none!important;}
#garden-intro {position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;}
#status::before {content:'BACKYARD BRAVE';position:absolute;z-index:2;top:max(9%,env(safe-area-inset-top));left:5%;width:90%;text-align:center;font-size:clamp(28px,7vw,58px);font-weight:bold;text-shadow:0 3px 12px #263319;}
#status::after {content:'Getting the garden ready…';position:absolute;z-index:2;bottom:calc(13% + env(safe-area-inset-bottom));width:100%;text-align:center;font-size:clamp(16px,4vw,24px);text-shadow:0 2px 8px #172010;}
#status-progress {z-index:3;top:auto;bottom:calc(8% + env(safe-area-inset-bottom));width:min(65%,420px);height:12px;accent-color:#8aa64f;border:2px solid #e5d4a1;border-radius:10px;overflow:hidden;background:#354725;}
#status-progress::-webkit-progress-bar {background:#354725;}
#status-progress::-webkit-progress-value {background:#a6c56a;}
#status-progress::-moz-progress-bar {background:#a6c56a;}
#status-notice {position:relative;z-index:4;max-width:80%;}
</style>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const status=document.getElementById('status');
 if(!status || matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const video=document.createElement('video');
 video.id='garden-intro';video.muted=true;video.defaultMuted=true;
 video.loop=true;video.autoplay=true;video.playsInline=true;
 video.setAttribute('playsinline','');video.setAttribute('muted','');
 video.poster='garden-poster.png';video.src='garden-intro.mp4';
 video.setAttribute('aria-hidden','true');status.prepend(video);
 const play=()=>{if(status.isConnected&&!document.hidden)video.play().catch(()=>{});};
 const visibility=()=>document.hidden?video.pause():play();
 document.addEventListener('visibilitychange',visibility);
 const observer=new MutationObserver(()=>{if(!status.isConnected){video.pause();video.removeAttribute('src');video.load();observer.disconnect();document.removeEventListener('visibilitychange',visibility);}});
 observer.observe(document.body,{childList:true});play();
});
</script>
