<style>
html {margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#c2d187 url('garden-poster.png') center/cover no-repeat;overscroll-behavior:none;}
body {position:fixed;inset:0;margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;overscroll-behavior:none;}
#canvas {position:absolute;inset:0;display:block;width:100%;height:100%;}
#status {position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#c2d187 url('garden-poster.png') center/cover no-repeat;font-family:Georgia,serif;color:#fff1ca;z-index:10;}
#status-splash {display:none!important;}
#garden-intro {position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;}
#status::after {content:'Getting the garden ready…';position:absolute;z-index:2;bottom:calc(18% + env(safe-area-inset-bottom));width:100%;text-align:center;font-size:clamp(16px,4vw,24px);text-shadow:0 2px 8px #172010;}
#status.ready::after {content:'';}
#status-progress {z-index:3;top:auto;bottom:calc(12% + env(safe-area-inset-bottom));width:min(65%,420px);height:12px;accent-color:#8aa64f;border:2px solid #e5d4a1;border-radius:10px;overflow:hidden;background:#354725;}
#status-progress::-webkit-progress-bar {background:#354725;}
#status-progress::-webkit-progress-value {background:#a6c56a;}
#status-progress::-moz-progress-bar {background:#a6c56a;}
#status.ready #status-progress {display:none!important;}
#status-notice {position:relative;z-index:4;max-width:80%;}
#garden-enter {position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(5% + env(safe-area-inset-bottom));width:min(70vw,320px);height:100px;border:0;background:transparent url('wood-tab-natural.png') center/110% 141% no-repeat;color:#49351e;font:bold 30px Georgia,serif;cursor:pointer;touch-action:manipulation;text-shadow:0 1px #fff1c8;}
#garden-enter:hover {filter:brightness(1.08);}
#garden-enter:active {transform:translateX(-50%) scale(.97);}
#garden-enter:focus-visible {outline:3px solid #f5edba;outline-offset:2px;border-radius:24px;}
#garden-enter[hidden] {display:none;}
/* Installed iOS apps can report a shortened percentage/innerHeight viewport
   even while drawing behind the status bar. vh includes that screen area. */
html.garden-standalone,html.garden-standalone body {height:100vh;min-height:100vh;}
html.garden-standalone #status {position:absolute;height:100%;}
</style>
<script>
window.backyardTopInsetRatio=()=>{
 const probe=document.createElement('div');
 probe.style.cssText='position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top)';
 document.body.append(probe);
 let top=parseFloat(getComputedStyle(probe).paddingTop)||0;probe.remove();
 // Some iOS Home Screen versions report zero despite an overlaid status bar.
 const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 if(ios&&(navigator.standalone||matchMedia('(display-mode: standalone)').matches))top=Math.max(top,60);
 return top/Math.max(1,document.body.getBoundingClientRect().height);
};
window.backyardConfigureDisplay=(config)=>{
 if(!(navigator.standalone||matchMedia('(display-mode: standalone)').matches))return;
 document.documentElement.classList.add('garden-standalone');
 const canvas=document.getElementById('canvas');
 // Let Godot observe the externally sized buffer instead of overwriting it
 // every frame with the shorter window.innerHeight.
 config.canvasResizePolicy=0;
 const fit=()=>{
  const r=document.body.getBoundingClientRect(), scale=devicePixelRatio||1;
  const w=Math.max(1,Math.round(r.width*scale)),h=Math.max(1,Math.round(r.height*scale));
  if(canvas.width!==w)canvas.width=w;
  if(canvas.height!==h)canvas.height=h;
 };
 new ResizeObserver(fit).observe(document.body);
 window.addEventListener('pageshow',fit);
 window.addEventListener('resize',fit);
 fit();
};
window.backyardLoadingComplete=(enter)=>{
 const status=document.getElementById('status');
 const button=document.getElementById('garden-enter');
 status.classList.add('ready');
 button.hidden=false;
 button.onclick=()=>{button.disabled=true;enter();document.getElementById('canvas').focus();};
};
document.addEventListener('DOMContentLoaded',()=>{
 // Opt-in, local-only measurements of the actual game page on a phone.
 // This does not access progression, transmit data, or change viewport geometry.
 if(new URLSearchParams(location.search).has('display-check')){
  const edge=document.createElement('div');
  edge.style.cssText='position:fixed;inset:0 0 auto;height:4px;background:#ff00ff;z-index:2147483647;pointer-events:none';
  const probe=document.createElement('div');
  probe.style.cssText='position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
  const panel=document.createElement('section');
  panel.style.cssText='position:fixed;z-index:2147483646;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;max-height:65%;overflow:auto;padding:12px;background:#fff7df;color:#302819;border:2px solid #73582c;border-radius:8px;font:13px/1.4 monospace;touch-action:pan-y';
  const heading=document.createElement('strong');heading.textContent='DISPLAY CHECK 1 — screenshot this panel';
  const report=document.createElement('pre');report.style.cssText='white-space:pre-wrap;margin:8px 0;font:inherit';
  const close=document.createElement('button');close.textContent='Close display check';
  panel.append(heading,report,close);document.body.append(probe,edge,panel);
  const rect=(selector)=>{const el=document.querySelector(selector);if(!el)return 'absent';const r=el.getBoundingClientRect();return `x ${Math.round(r.x)}, y ${Math.round(r.y)}, ${Math.round(r.width)} x ${Math.round(r.height)}`;};
  const update=()=>{
   const v=visualViewport, p=getComputedStyle(probe);
   report.textContent=[
    `Mode: ${navigator.standalone||matchMedia('(display-mode: standalone)').matches?'Home Screen':'browser'}`,
    `Screen: ${screen.width} x ${screen.height}; DPR ${devicePixelRatio}`,
    `Window: ${innerWidth} x ${innerHeight}`,
    `Document: ${document.documentElement.clientWidth} x ${document.documentElement.clientHeight}`,
    `Visual: ${v?`${Math.round(v.width)} x ${Math.round(v.height)}, top ${v.offsetTop}, scale ${v.scale}`:'unavailable'}`,
    `Safe top/bottom: ${p.paddingTop} / ${p.paddingBottom}`,
    `Body: ${rect('body')}`,`Canvas: ${rect('#canvas')}`,`Intro: ${rect('#status')}`,
    'Pink line = top edge the webpage can draw.',
    'Include the clock and bottom of the screen in the screenshot.'
   ].join('\n');
  };
  const timer=setInterval(update,1000);update();
  close.onclick=()=>{clearInterval(timer);panel.remove();edge.remove();probe.remove();};
 }
 const status=document.getElementById('status');
 if(!status)return;
 const button=document.createElement('button');button.id='garden-enter';button.textContent='ENTER';button.hidden=true;status.append(button);
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const video=document.createElement('video');video.id='garden-intro';video.muted=true;video.defaultMuted=true;
 video.loop=true;video.autoplay=true;video.playsInline=true;
 video.setAttribute('playsinline','');video.setAttribute('muted','');video.poster='garden-poster.png';video.src='garden-intro.mp4';
 video.setAttribute('aria-hidden','true');status.prepend(video);
 const play=()=>{if(status.isConnected&&!document.hidden)video.play().catch(()=>{});};
 const visibility=()=>document.hidden?video.pause():play();document.addEventListener('visibilitychange',visibility);
 const observer=new MutationObserver(()=>{if(!status.isConnected){video.pause();video.removeAttribute('src');video.load();observer.disconnect();document.removeEventListener('visibilitychange',visibility);}});
 observer.observe(document.body,{childList:true});play();
});
</script>

<style>
#scout-name-dialog {position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;width:min(82vw,380px);box-sizing:border-box;overflow:auto;border:5px solid #95703e;border-radius:18px;padding:24px;background:#f6e7c4;color:#49351e;box-shadow:0 6px 22px #17201066;font:18px Georgia,serif;touch-action:auto;}
#scout-name-dialog::backdrop {background:#172010bb;}
#scout-name-dialog h2 {margin:0 0 20px;text-align:center;font-size:25px;}
#scout-name-dialog label {display:block;margin-bottom:8px;}
#scout-name-dialog input {box-sizing:border-box;width:100%;padding:12px;border:2px solid #9a8555;border-radius:9px;background:#fff6dc;color:#49351e;font:20px Georgia,serif;touch-action:auto;user-select:text;-webkit-user-select:text;}
#scout-name-dialog .actions {display:flex;gap:12px;margin-top:18px;}
#scout-name-dialog button {flex:1;min-height:48px;border:2px solid #937343;border-radius:10px;background:#e7c48c;color:#49351e;font:bold 17px Georgia,serif;touch-action:manipulation;}
#scout-name-dialog button[type=submit] {background:#647e46;color:#fff5d3;}
#scout-name-dialog .notice {font-size:15px;min-height:20px;margin:8px 0;color:#85482f;}
</style>
<script>
window.backyardNameEditor=(()=>{
 let dialog=null, pending=null, reposition=null;
 const close=()=>{if(!dialog)return;dialog.close();dialog.remove();dialog=null;pending=null;window.visualViewport?.removeEventListener('resize',reposition);window.visualViewport?.removeEventListener('scroll',reposition);document.getElementById('canvas')?.focus();};
 return {
  open(name){
   close();pending=null;
   dialog=document.createElement('dialog');dialog.id='scout-name-dialog';
   dialog.innerHTML='<form><h2>Name your scout</h2><label for="scout-name-input">Scout name</label><input id="scout-name-input" type="text" maxlength="18" autocomplete="nickname" enterkeyhint="done" placeholder="Your scout’s name"><p class="notice" role="status"></p><div class="actions"><button type="button">Cancel</button><button type="submit">Save</button></div></form>';
   const input=dialog.querySelector('input');input.value=name;
   const submit=()=>{if(!input.value.trim()){dialog.querySelector('.notice').textContent='Please enter a name.';return;}pending=['save',input.value];};
   dialog.querySelector('form').onsubmit=e=>{e.preventDefault();submit();};
   dialog.querySelector('button[type=button]').onclick=()=>{pending=['cancel'];};
   dialog.addEventListener('cancel',e=>{e.preventDefault();pending=['cancel'];});
   dialog.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Escape'){e.preventDefault();pending=['cancel'];}});
   dialog.addEventListener('keyup',e=>e.stopPropagation());
   reposition=()=>{const v=window.visualViewport;dialog.style.top=((v?.offsetTop||0)+(v?.height||innerHeight)/2)+'px';dialog.style.maxHeight=Math.max(160,(v?.height||innerHeight)-24)+'px';};
   document.body.append(dialog);dialog.showModal();reposition();
   window.visualViewport?.addEventListener('resize',reposition);window.visualViewport?.addEventListener('scroll',reposition);
   input.focus();input.select();
  },
  take(){const result=pending;pending=null;return JSON.stringify(result||[]);},
  error(message){if(dialog)dialog.querySelector('.notice').textContent=message;},
  close
 };
})();
</script>
