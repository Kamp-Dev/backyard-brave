[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.json"
exclude_filter="*.txt,*.md,assets/player/scout-draw.png,assets/player/scout-release.png,assets/player/scout-walk-a.png,assets/player/scout-walk-b.png,assets/player/scout-walk-legs.png,assets/player/scout-roll.png"
export_path="../web/index.html"
script_export_mode=2

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/head_include="<style>\nhtml {margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#c2d187 url('garden-poster.png') center/cover no-repeat;overscroll-behavior:none;}\nbody {position:fixed;inset:0;margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;overscroll-behavior:none;}\n#canvas {position:absolute;inset:0;display:block;width:100%;height:100%;}\n#status {position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#c2d187 url('garden-poster.png') center/cover no-repeat;font-family:Georgia,serif;color:#fff1ca;z-index:10;}\n#status-splash {display:none!important;}\n#garden-intro {position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;}\n#status::after {content:'Getting the garden ready…';position:absolute;z-index:2;bottom:calc(18% + env(safe-area-inset-bottom));width:100%;text-align:center;font-size:clamp(16px,4vw,24px);text-shadow:0 2px 8px #172010;}\n#status.ready::after {content:'';}\n#status-progress {z-index:3;top:auto;bottom:calc(12% + env(safe-area-inset-bottom));width:min(65%,420px);height:12px;accent-color:#8aa64f;border:2px solid #e5d4a1;border-radius:10px;overflow:hidden;background:#354725;}\n#status-progress::-webkit-progress-bar {background:#354725;}\n#status-progress::-webkit-progress-value {background:#a6c56a;}\n#status-progress::-moz-progress-bar {background:#a6c56a;}\n#status.ready #status-progress {display:none!important;}\n#status-notice {position:relative;z-index:4;max-width:80%;}\n#garden-enter {position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(5% + env(safe-area-inset-bottom));width:min(70vw,320px);height:100px;border:0;background:transparent url('wood-tab-natural.png') center/110% 141% no-repeat;color:#49351e;font:bold 30px Georgia,serif;cursor:pointer;touch-action:manipulation;text-shadow:0 1px #fff1c8;}\n#garden-enter:hover {filter:brightness(1.08);}\n#garden-enter:active {transform:translateX(-50%) scale(.97);}\n#garden-enter:focus-visible {outline:3px solid #f5edba;outline-offset:2px;border-radius:24px;}\n#garden-enter[hidden] {display:none;}\n</style>\n<script>\nwindow.backyardLoadingComplete=(enter)=>{\n const status=document.getElementById('status');\n const button=document.getElementById('garden-enter');\n status.classList.add('ready');\n button.hidden=false;\n button.onclick=()=>{button.disabled=true;enter();document.getElementById('canvas').focus();};\n};\ndocument.addEventListener('DOMContentLoaded',()=>{\n // Opt-in, local-only measurements of the actual game page on a phone.\n // This does not access progression, transmit data, or change viewport geometry.\n if(new URLSearchParams(location.search).has('display-check')){\n  const edge=document.createElement('div');\n  edge.style.cssText='position:fixed;inset:0 0 auto;height:4px;background:#ff00ff;z-index:2147483647;pointer-events:none';\n  const probe=document.createElement('div');\n  probe.style.cssText='position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';\n  const panel=document.createElement('section');\n  panel.style.cssText='position:fixed;z-index:2147483646;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;max-height:65%;overflow:auto;padding:12px;background:#fff7df;color:#302819;border:2px solid #73582c;border-radius:8px;font:13px/1.4 monospace;touch-action:pan-y';\n  const heading=document.createElement('strong');heading.textContent='DISPLAY CHECK 1 — screenshot this panel';\n  const report=document.createElement('pre');report.style.cssText='white-space:pre-wrap;margin:8px 0;font:inherit';\n  const close=document.createElement('button');close.textContent='Close display check';\n  panel.append(heading,report,close);document.body.append(probe,edge,panel);\n  const rect=(selector)=>{const el=document.querySelector(selector);if(!el)return 'absent';const r=el.getBoundingClientRect();return `x ${Math.round(r.x)}, y ${Math.round(r.y)}, ${Math.round(r.width)} x ${Math.round(r.height)}`;};\n  const update=()=>{\n   const v=visualViewport, p=getComputedStyle(probe);\n   report.textContent=[\n    `Mode: ${navigator.standalone||matchMedia('(display-mode: standalone)').matches?'Home Screen':'browser'}`,\n    `Screen: ${screen.width} x ${screen.height}; DPR ${devicePixelRatio}`,\n    `Window: ${innerWidth} x ${innerHeight}`,\n    `Document: ${document.documentElement.clientWidth} x ${document.documentElement.clientHeight}`,\n    `Visual: ${v?`${Math.round(v.width)} x ${Math.round(v.height)}, top ${v.offsetTop}, scale ${v.scale}`:'unavailable'}`,\n    `Safe top/bottom: ${p.paddingTop} / ${p.paddingBottom}`,\n    `Body: ${rect('body')}`,`Canvas: ${rect('#canvas')}`,`Intro: ${rect('#status')}`,\n    'Pink line = top edge the webpage can draw.',\n    'Include the clock and bottom of the screen in the screenshot.'\n   ].join('\\n');\n  };\n  const timer=setInterval(update,1000);update();\n  close.onclick=()=>{clearInterval(timer);panel.remove();edge.remove();probe.remove();};\n }\n const status=document.getElementById('status');\n if(!status)return;\n const button=document.createElement('button');button.id='garden-enter';button.textContent='ENTER';button.hidden=true;status.append(button);\n if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;\n const video=document.createElement('video');video.id='garden-intro';video.muted=true;video.defaultMuted=true;\n video.loop=true;video.autoplay=true;video.playsInline=true;\n video.setAttribute('playsinline','');video.setAttribute('muted','');video.poster='garden-poster.png';video.src='garden-intro.mp4';\n video.setAttribute('aria-hidden','true');status.prepend(video);\n const play=()=>{if(status.isConnected&&!document.hidden)video.play().catch(()=>{});};\n const visibility=()=>document.hidden?video.pause():play();document.addEventListener('visibilitychange',visibility);\n const observer=new MutationObserver(()=>{if(!status.isConnected){video.pause();video.removeAttribute('src');video.load();observer.disconnect();document.removeEventListener('visibilitychange',visibility);}});\n observer.observe(document.body,{childList:true});play();\n});\n</script>\n"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

