[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.json"
exclude_filter="*.txt,*.md,assets/player/scout-draw.png,assets/player/scout-release.png,assets/player/scout-walk-a.png,assets/player/scout-walk-b.png,assets/player/scout-walk-legs.png,assets/player/scout-roll.png"
export_path="../web/index.html"
script_export_mode=2

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/head_include="<style>\nhtml,body {margin:0;padding:0;width:100%;height:100%;min-height:100dvh;background:#c2d187;overscroll-behavior:none;}\n#status {position:fixed;inset:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#c2d187 url('garden-poster.png') center/cover no-repeat;font-family:Georgia,serif;color:#fff1ca;z-index:10;}\n#status-splash {display:none!important;}\n#garden-intro {position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;}\n#status::before {content:'BACKYARD BRAVE';position:absolute;z-index:2;top:calc(4% + env(safe-area-inset-top));left:5%;width:90%;text-align:center;font-size:clamp(28px,7vw,58px);font-weight:bold;text-shadow:0 3px 12px #263319;}\n#status::after {content:'Getting the garden ready…';position:absolute;z-index:2;bottom:calc(18% + env(safe-area-inset-bottom));width:100%;text-align:center;font-size:clamp(16px,4vw,24px);text-shadow:0 2px 8px #172010;}\n#status.ready::after {content:'';}\n#status-progress {z-index:3;top:auto;bottom:calc(12% + env(safe-area-inset-bottom));width:min(65%,420px);height:12px;accent-color:#8aa64f;border:2px solid #e5d4a1;border-radius:10px;overflow:hidden;background:#354725;}\n#status-progress::-webkit-progress-bar {background:#354725;}\n#status-progress::-webkit-progress-value {background:#a6c56a;}\n#status-progress::-moz-progress-bar {background:#a6c56a;}\n#status.ready #status-progress {display:none!important;}\n#status-notice {position:relative;z-index:4;max-width:80%;}\n#garden-enter {position:absolute;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(5% + env(safe-area-inset-bottom));width:min(70vw,320px);height:100px;border:0;background:transparent url('wood-tab-natural.png') center/110% 141% no-repeat;color:#49351e;font:bold 30px Georgia,serif;cursor:pointer;touch-action:manipulation;text-shadow:0 1px #fff1c8;}\n#garden-enter:hover {filter:brightness(1.08);}\n#garden-enter:active {transform:translateX(-50%) scale(.97);}\n#garden-enter:focus-visible {outline:3px solid #f5edba;outline-offset:2px;border-radius:24px;}\n#garden-enter[hidden] {display:none;}\n</style>\n<script>\nwindow.backyardLoadingComplete=(enter)=>{\n const status=document.getElementById('status');\n const button=document.getElementById('garden-enter');\n status.classList.add('ready');\n button.hidden=false;\n button.onclick=()=>{button.disabled=true;enter();document.getElementById('canvas').focus();};\n};\ndocument.addEventListener('DOMContentLoaded',()=>{\n const status=document.getElementById('status');\n if(!status)return;\n const button=document.createElement('button');button.id='garden-enter';button.textContent='ENTER';button.hidden=true;status.append(button);\n if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;\n const video=document.createElement('video');video.id='garden-intro';video.muted=true;video.defaultMuted=true;\n video.loop=true;video.autoplay=true;video.playsInline=true;\n video.setAttribute('playsinline','');video.setAttribute('muted','');video.poster='garden-poster.png';video.src='garden-intro.mp4';\n video.setAttribute('aria-hidden','true');status.prepend(video);\n const play=()=>{if(status.isConnected&&!document.hidden)video.play().catch(()=>{});};\n const visibility=()=>document.hidden?video.pause():play();document.addEventListener('visibilitychange',visibility);\n const observer=new MutationObserver(()=>{if(!status.isConnected){video.pause();video.removeAttribute('src');video.load();observer.disconnect();document.removeEventListener('visibilitychange',visibility);}});\n observer.observe(document.body,{childList:true});play();\n});\n</script>\n"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

