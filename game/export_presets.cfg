[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.json"
exclude_filter="*.txt,*.md,assets/player/scout-draw.png,assets/player/scout-release.png,assets/player/scout-walk-a.png,assets/player/scout-walk-b.png,assets/player/scout-walk-legs.png,assets/player/scout-roll.png"
export_path="../web/index.html"
script_export_mode=2

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/head_include="<style>\nbody {background:#50653b;}\n#status {position:fixed;inset:0;overflow:hidden;background:#50653b url('garden-poster.png') center/cover no-repeat;font-family:Georgia,serif;color:#fff1ca;}\n#status-splash {display:none!important;}\n#garden-intro {position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;}\n#status::before {content:'BACKYARD BRAVE';position:absolute;z-index:2;top:max(9%,env(safe-area-inset-top));left:5%;width:90%;text-align:center;font-size:clamp(28px,7vw,58px);font-weight:bold;text-shadow:0 3px 12px #263319;}\n#status::after {content:'Getting the garden ready…';position:absolute;z-index:2;bottom:calc(13% + env(safe-area-inset-bottom));width:100%;text-align:center;font-size:clamp(16px,4vw,24px);text-shadow:0 2px 8px #172010;}\n#status-progress {z-index:3;top:auto;bottom:calc(8% + env(safe-area-inset-bottom));width:min(65%,420px);height:12px;accent-color:#8aa64f;border:2px solid #e5d4a1;border-radius:10px;overflow:hidden;background:#354725;}\n#status-progress::-webkit-progress-bar {background:#354725;}\n#status-progress::-webkit-progress-value {background:#a6c56a;}\n#status-progress::-moz-progress-bar {background:#a6c56a;}\n#status-notice {position:relative;z-index:4;max-width:80%;}\n</style>\n<script>\ndocument.addEventListener('DOMContentLoaded',()=>{\n const status=document.getElementById('status');\n if(!status || matchMedia('(prefers-reduced-motion: reduce)').matches)return;\n const video=document.createElement('video');\n video.id='garden-intro';video.muted=true;video.defaultMuted=true;\n video.loop=true;video.autoplay=true;video.playsInline=true;\n video.setAttribute('playsinline','');video.setAttribute('muted','');\n video.poster='garden-poster.png';video.src='garden-intro.mp4';\n video.setAttribute('aria-hidden','true');status.prepend(video);\n const play=()=>{if(status.isConnected&&!document.hidden)video.play().catch(()=>{});};\n const visibility=()=>document.hidden?video.pause():play();\n document.addEventListener('visibilitychange',visibility);\n const observer=new MutationObserver(()=>{if(!status.isConnected){video.pause();video.removeAttribute('src');video.load();observer.disconnect();document.removeEventListener('visibilitychange',visibility);}});\n observer.observe(document.body,{childList:true});play();\n});\n</script>\n"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.1]
name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
