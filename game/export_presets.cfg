[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="*.txt,*.md"
export_path="../web/index.html"
script_export_mode=2

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.1]
name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="*.txt,*.md"
export_path="../android/Backyard-Brave.apk"
script_export_mode=2

[preset.1.options]
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=2
version/name="0.1.1-test"
package/unique_name="com.kampdev.backyardbrave"
package/name="Backyard Brave"
package/signed=true
keystore/debug="/tmp/backyard-debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
screen/immersive_mode=true
permissions/vibrate=true
