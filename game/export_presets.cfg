exclude_filter="*.txt,*.md,assets/player/scout-draw.png,assets/player/scout-release.png,assets/player/scout-walk-a.png,assets/player/scout-walk-b.png,assets/player/scout-walk-legs.png,assets/player/scout-roll.png"
export_path="../android/Backyard-Brave.apk"
script_export_mode=2

[preset.1.options]
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=25
version/name="0.13.0-test"
package/unique_name="com.kampdev.backyardbrave"
package/name="Backyard Brave"
package/signed=true
keystore/debug="/tmp/backyard-debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
screen/immersive_mode=true
permissions/vibrate=true
