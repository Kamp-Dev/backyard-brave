[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="*.txt,*.md"
export_path="../web/index.html"
script_export_mode=2

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/head_include="<style>\nbody { background: #c2d187; }\n#status { background: #c2d187; gap: 16px; font-family: Georgia, serif; color: #354527; }\n#status-splash.fullsize--false, #status-splash.fullsize--true { position: static; width: 88px; height: 88px; object-fit: contain; margin: 0; order: 0; }\n#status::before { content: 'BACKYARD BRAVE'; font-size: clamp(24px, 6vw, 38px); font-weight: bold; order: 1; }\n#status::after { content: 'Getting the garden ready…'; font-size: 18px; order: 2; }\n#status-progress { top: calc(50% + 125px); bottom: auto; width: min(65%, 280px); height: 12px; accent-color: #597b38; border: 2px solid #80603b; border-radius: 8px; overflow: hidden; background: #f3e6c4; }\n#status-progress::-webkit-progress-bar { background: #f3e6c4; }\n#status-progress::-webkit-progress-value { background: #597b38; }\n#status-progress::-moz-progress-bar { background: #597b38; }\n#status-notice { order: 3; }\n</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.1]
name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="*.txt,*.md"
export_path="../android/Backyard-Brave.apk"
script_export_mode=2

[preset.1.options]
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=18
version/name="0.7.1-test"
package/unique_name="com.kampdev.backyardbrave"
package/name="Backyard Brave"
package/signed=true
keystore/debug="/tmp/backyard-debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
screen/immersive_mode=true
permissions/vibrate=true
